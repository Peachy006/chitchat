syntax = "proto3";
package chat;
option go_package = "chat/grpc;pb";

service Chat{
	rpc Connect(stream ChatMessage) returns (stream ChatBroadcast);
}

message ChatMessage { 
	string sender = 1;
    string text = 2;
	int64 time = 3;
}

message ChatBroadcast {
	string sender = 1;
	string text = 2;
	int64 time = 3;
}

